name: Mirror APK to Release

on:
  push:
    paths:
      - latest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          with open('latest.json', encoding='utf-8') as f:
              data = json.load(f)
          print(f"VERSION={data['versionName']}")
          print(f"SOURCE={data.get('sourceUrl') or data['apkUrl']}")
          print(f"SHA={data['sha256']}")
          print(f"SIZE={data['size']}")
          PY

      - name: Download and verify APK
        shell: bash
        run: |
          ASSET="豆包安全护盾-${VERSION}.apk"
          curl -fL --retry 3 --retry-delay 2 "$SOURCE" -o "$ASSET"
          echo "$SHA  $ASSET" | sha256sum -c -
          test "$(stat -c%s "$ASSET")" = "$SIZE"

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          ASSET="豆包安全护盾-${VERSION}.apk"
          NOTES=$(python3 -c "import json;d=json.load(open('latest.json',encoding='utf-8'));print('\n'.join('- '+x for x in d.get('changelog',[])))")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "豆包安全护盾 $VERSION" --notes "$NOTES"
          fi
